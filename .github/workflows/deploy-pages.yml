name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Natural Earth is 41 MB per run and changes rarely; the region shapes it
      # produces are what the harvest samples footprints against. Without them
      # the harvest falls back to the nine curated extents and files every
      # georeferenced map into eight buckets.
      - name: Cache Natural Earth downloads
        uses: actions/cache@v4
        with:
          path: .cache
          key: natural-earth-${{ hashFiles('scripts/build-regions.mjs') }}
          restore-keys: natural-earth-

      - name: Build the region tree
        run: node scripts/build-regions.mjs

      - name: Harvest sources
        run: node scripts/harvest.mjs

      - name: Rebuild index
        run: node scripts/build-index.mjs

      - name: Validate layer files
        run: node scripts/validate-layers.mjs

      - uses: actions/configure-pages@v4

      - name: Assemble site
        run: |
          mkdir -p _site
          # .cache is build input, not site content: 65 MB of Natural Earth
          # GeoJSON and region polygons nothing on the page fetches.
          rsync -a --exclude='_site' --exclude='.git' --exclude='node_modules' \
                   --exclude='.github' --exclude='.cache' . _site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
