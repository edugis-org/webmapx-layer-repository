name: Check Layer Availability

on:
  push:
    branches: [main]
    paths:
      - 'layers/**'
  pull_request:
    paths:
      - 'layers/**'
  schedule:
    # Weekly on Monday 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit status updates on scheduled runs

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      # Checks that $ref links resolve. The index is a build artifact and is not
      # committed: this job has no harvested/, so the index it builds is missing
      # those entries and must never be written back over the real one.
      - name: Rebuild index
        run: node scripts/build-index.mjs

      - name: Validate layer files
        run: node scripts/validate-layers.mjs

      - name: Test layer availability
        run: node scripts/test-layers.mjs
        continue-on-error: true   # unreachable layers don't block the status-commit step
        env:
          # Add API keys as GitHub repository secrets and reference them here.
          # Name pattern: APIKEY_<PROVIDERNAME> (uppercase).
          APIKEY_OPENWEATHERMAP: ${{ secrets.APIKEY_OPENWEATHERMAP }}
          APIKEY_MAPBOX:         ${{ secrets.APIKEY_MAPBOX }}
          APIKEY_MAPTILER:       ${{ secrets.APIKEY_MAPTILER }}
          APIKEY_BING:           ${{ secrets.APIKEY_BING }}
          APIKEY_TOMTOM:         ${{ secrets.APIKEY_TOMTOM }}
          APIKEY_HERE:           ${{ secrets.APIKEY_HERE }}
          APIKEY_STADIA:         ${{ secrets.APIKEY_STADIA }}
          APIKEY_THUNDERFOREST:  ${{ secrets.APIKEY_THUNDERFOREST }}
          APIKEY_NEXTZEN:        ${{ secrets.APIKEY_NEXTZEN }}
          APIKEY_GEODANMAPS:     ${{ secrets.APIKEY_GEODANMAPS }}
          # Stadia authenticates on the request origin and issues no key; MapTiler
          # locks keys to registered origins. Without a registered origin here,
          # both record as auth-required and the history learns the wrong thing.
          PROBE_REFERER:         ${{ secrets.PROBE_REFERER }}

      - name: Commit status updates (scheduled runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add layers/ status/
          git diff --staged --quiet || git commit -m "chore: update layer status [skip ci]"
          git push
